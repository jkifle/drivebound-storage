services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-photos}
      POSTGRES_USER: ${POSTGRES_USER:-photos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-hybrid}
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://photos:change-me@postgres:5432/photos}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ORIGINALS_PATH: /data/originals
      DERIVATIVES_PATH: /data/derivatives
      STAGING_PATH: /data/staging
      REPLICA_PATH: /data/replicas
      AUTO_PROTECT_UPLOADS: ${AUTO_PROTECT_UPLOADS:-true}
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_URL: ${API_URL:-http://localhost:8000}
      JWT_SECRET: ${JWT_SECRET:-change-this-before-enabling-remote-access}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_SESSION_DAYS: ${REFRESH_SESSION_DAYS:-30}
      EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Drivebound <noreply@drivebound.local>}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      MFA_ENCRYPTION_SECRET: ${MFA_ENCRYPTION_SECRET:-change-this-mfa-secret-before-production}
      AUTH_RATE_LIMIT_ATTEMPTS: ${AUTH_RATE_LIMIT_ATTEMPTS:-8}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-900}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/auth/google/callback}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      REMOTE_ACCESS_ENABLED: ${REMOTE_ACCESS_ENABLED:-false}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1}
      EXTERNAL_LIBRARY_ROOTS: ${EXTERNAL_LIBRARY_ROOTS:-/data/imports}
      SEMANTIC_ENABLED: ${SEMANTIC_ENABLED:-true}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      INTELLIGENCE_CACHE_PATH: /data/models
      MEDIA_ENCRYPTION_ENABLED: ${MEDIA_ENCRYPTION_ENABLED:-true}
      MEDIA_ENCRYPTION_MASTER_KEY: ${MEDIA_ENCRYPTION_MASTER_KEY:-RZAIpFM5CAciKTy4UABCTvvyD83LfeB9r_ZR4z0LnKQ=}
      MEDIA_ENCRYPTION_MIGRATE_LEGACY: ${MEDIA_ENCRYPTION_MIGRATE_LEGACY:-false}
      OBSERVABILITY_LOG_JSON: ${OBSERVABILITY_LOG_JSON:-false}
    volumes:
      - ./data/originals:/data/originals
      - ./data/derivatives:/data/derivatives
      - ./data/staging:/data/staging
      - ./data/replicas:/data/replicas:ro
      - ./data/imports:/data/imports:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://photos:change-me@postgres:5432/photos}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ORIGINALS_PATH: /data/originals
      DERIVATIVES_PATH: /data/derivatives
      STAGING_PATH: /data/staging
      REPLICA_PATH: /data/replicas
      AUTO_PROTECT_UPLOADS: ${AUTO_PROTECT_UPLOADS:-true}
      EXTERNAL_LIBRARY_ROOTS: ${EXTERNAL_LIBRARY_ROOTS:-/data/imports}
      SEMANTIC_ENABLED: ${SEMANTIC_ENABLED:-true}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      INTELLIGENCE_CACHE_PATH: /data/models
      MEDIA_ENCRYPTION_ENABLED: ${MEDIA_ENCRYPTION_ENABLED:-true}
      MEDIA_ENCRYPTION_MASTER_KEY: ${MEDIA_ENCRYPTION_MASTER_KEY:-RZAIpFM5CAciKTy4UABCTvvyD83LfeB9r_ZR4z0LnKQ=}
    volumes:
      - ./data/originals:/data/originals
      - ./data/derivatives:/data/derivatives
      - ./data/replicas:/data/replicas
      - ./data/imports:/data/imports:ro
      - model_cache:/data/models
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app:celery_app inspect ping -d celery@$${HOSTNAME} --timeout 5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://photos:change-me@postgres:5432/photos}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ORIGINALS_PATH: /data/originals
      REPLICA_PATH: /data/replicas
      EXTERNAL_LIBRARY_ROOTS: ${EXTERNAL_LIBRARY_ROOTS:-/data/imports}
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-900}
      MEDIA_ENCRYPTION_ENABLED: ${MEDIA_ENCRYPTION_ENABLED:-true}
      MEDIA_ENCRYPTION_MASTER_KEY: ${MEDIA_ENCRYPTION_MASTER_KEY:-RZAIpFM5CAciKTy4UABCTvvyD83LfeB9r_ZR4z0LnKQ=}
      MEDIA_ENCRYPTION_MIGRATE_LEGACY: ${MEDIA_ENCRYPTION_MIGRATE_LEGACY:-false}
    volumes:
      - ./data/originals:/data/originals
      - ./data/replicas:/data/replicas
      - ./data/imports:/data/imports:ro
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "beat", "--loglevel=INFO"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  model_cache:
