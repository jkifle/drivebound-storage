[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "drivebound-backend"
version = "0.5.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20.1,<2",
  "aiofiles>=25.1.0,<26",
  "asyncpg>=0.32.0,<1",
  "celery[redis]>=5.6.3,<6",
  "fastapi>=0.162.0,<1",
  "fastembed>=0.9.1,<1",
  "google-auth>=2.62.0,<3",
  "httpx>=0.28.1,<1",
  "email-validator>=2.3.0,<3",
  "Pillow>=13.0.0,<14",
  "pgvector>=0.5.1,<1",
  "PyJWT>=2.15.1,<3",
  "pwdlib[argon2]>=0.3.1,<1",
  "pyotp>=2.10.0,<3",
  "cryptography>=50.0.2,<51",
  "pydantic-settings>=2.16.2,<3",
  "python-multipart>=0.0.32,<1",
  # Celery 5.6 / Kombu's Redis transport requires redis-py below 6.5.
  "redis>=8.1.0,<8.2",
  "sqlalchemy[asyncio]>=2.1.6,<3",
  "uvicorn[standard]>=0.54.0,<1",
  "webauthn>=3.0.1,<4",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28.1,<1",
  "pytest>=9.2.0,<10",
  "pytest-asyncio>=1.4.1,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]
