[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "drivebound-backend"
version = "0.5.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "aiofiles>=24.1,<25",
  "asyncpg>=0.29,<1",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "fastembed>=0.7,<1",
  "google-auth>=2.40,<3",
  "httpx>=0.28,<1",
  "email-validator>=2.2,<3",
  "Pillow>=11,<12",
  "pgvector>=0.4,<1",
  "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.3,<1",
  "pyotp>=2.9,<3",
  "cryptography>=45,<47",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "redis>=5.0,<6",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
