[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drivebound-backend"
version = "0.5.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.19.1,<2",
  "aiofiles>=25.1.0,<26",
  "asyncpg>=0.31.0,<1",
  "celery[redis]>=5.6.3,<6",
  "fastapi>=0.141.1,<1",
  "fastembed>=0.8.0,<1",
  "google-auth>=2.56.3,<3",
  "httpx>=0.28.1,<1",
  "email-validator>=2.3.0,<3",
  "Pillow>=12.3.0,<13",
  "pgvector>=0.5.0,<1",
  "PyJWT>=2.13.0,<3",
  "pwdlib[argon2]>=0.3.1,<1",
  "pyotp>=2.10.0,<3",
  "cryptography>=50.0.0,<51",
  "pydantic-settings>=2.15.0,<3",
  "python-multipart>=0.0.32,<1",
  "redis>=8.1.0,<9",
  "sqlalchemy>=2.0.52,<3",
  "uvicorn[standard]>=0.52.3,<1",
  "webauthn>=3,<4",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28.1,<1",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]
