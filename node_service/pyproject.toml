[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drivebound-node-service"
version = "0.1.0"
description = "Background storage-node service for Drivebound"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Drivebound" }]
license = { text = "MIT" }

[project.scripts]
drivebound-node-service = "drivebound_node_service.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["drivebound_node_service*"]
